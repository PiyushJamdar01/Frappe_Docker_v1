name: Unity PR Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unity Image
        run: |
          docker buildx build \
            --load \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=version-16 \
            --secret=id=apps_json,src=apps.json \
            --tag=piyush/erpnext-custom:16 \
            --file=images/custom/Containerfile .

      - name: Verify Image Exists
        run: |
          docker images | grep piyush/erpnext-custom

      - name: Verify Bench Exists
        run: |
          docker run --rm piyush/erpnext-custom:16 bench version

      - name: Verify Installed Apps
        run: |
          docker run --rm piyush/erpnext-custom:16 bench version | tee versions.txt

          grep frappe versions.txt
          grep erpnext versions.txt
          grep hrms versions.txt
          grep helpdesk versions.txt
          grep insights versions.txt
          grep builder versions.txt
          grep lms versions.txt

      - name: Create Environment File
        run: |
          cat > .env <<EOF
          ERPNEXT_VERSION=v16.53.0
          DB_PASSWORD=123
          HTTP_PUBLISH_PORT=8080
          CUSTOM_IMAGE=piyush/erpnext-custom
          CUSTOM_TAG=16
          PULL_POLICY=never
          EOF

      - name: Start Compose Stack
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            up -d

      - name: Show Running Containers
        run: |
          docker compose ps

      - name: Wait For Backend Startup
        run: |
          sleep 60

      - name: Create Test Site
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench new-site erp.localhost \
            --mariadb-root-password 123 \
            --admin-password Admin@123

      - name: Install ERPNext
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site erp.localhost install-app erpnext

      - name: List Installed Apps From Site
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site erp.localhost list-apps

      - name: Validate Site Health
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site erp.localhost doctor