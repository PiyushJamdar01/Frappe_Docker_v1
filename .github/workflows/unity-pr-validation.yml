name: Unity PR Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Unity Image
        run: |
          docker buildx build \
            --load \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=version-16 \
            --secret=id=apps_json,src=apps.json \
            --tag=piyush/erpnext-custom:16 \
            --file=images/custom/Containerfile .

      - name: Verify Image Exists
        run: |
          docker images | grep piyush/erpnext-custom

      - name: Verify Bench Exists
        run: |
          docker run --rm piyush/erpnext-custom:16 bench version

      - name: Verify Installed Apps
        run: |
          docker run --rm piyush/erpnext-custom:16 bench version | tee versions.txt

          grep frappe versions.txt
          grep erpnext versions.txt
          grep hrms versions.txt
          grep helpdesk versions.txt
          grep insights versions.txt
          grep builder versions.txt
          grep lms versions.txt