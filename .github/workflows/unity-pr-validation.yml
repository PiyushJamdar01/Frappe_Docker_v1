name: Unity PR Validation

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    # Values are fetched from GitHub Actions Variables and Secrets.
    env:
      IMAGE: ${{ vars.IMAGE }}
      SITE_NAME: ${{ vars.SITE_NAME }}
      HTTP_PUBLISH_PORT: ${{ vars.HTTP_PUBLISH_PORT }}
      GUNICORN_THREADS: ${{ vars.GUNICORN_THREADS }}
      GUNICORN_WORKERS: ${{ vars.GUNICORN_WORKERS }}
      GUNICORN_TIMEOUT: ${{ vars.GUNICORN_TIMEOUT }}

      ADMIN_PASS: ${{ secrets.ADMIN_PASS }}
      DB_ROOT_PASS: ${{ secrets.DB_ROOT_PASS }}

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Validate required GitHub variables and secrets
      # --------------------------------------------------

      - name: Validate GitHub Configuration
        run: |
          set -e

          if [ -z "$IMAGE" ]; then
            echo "ERROR: IMAGE is not configured in GitHub Variables."
            exit 1
          fi

          if [ -z "$SITE_NAME" ]; then
            echo "ERROR: SITE_NAME is not configured in GitHub Variables."
            exit 1
          fi

          if [ -z "$ADMIN_PASS" ]; then
            echo "ERROR: ADMIN_PASS is not configured in GitHub Secrets."
            exit 1
          fi

          if [ -z "$DB_ROOT_PASS" ]; then
            echo "ERROR: DB_ROOT_PASS is not configured in GitHub Secrets."
            exit 1
          fi

          echo "Required GitHub configuration is available."

          echo "Docker image: $IMAGE"
          echo "Site name: $SITE_NAME"

      # --------------------------------------------------
      # 3. Set up Docker Buildx
      # --------------------------------------------------

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # --------------------------------------------------
      # 4. Build custom Unity image
      # --------------------------------------------------

      - name: Build Unity Image
        run: |
          docker buildx build \
            --load \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=v16.60.2 \
            --secret=id=apps_json,src=apps.json \
            --tag="$IMAGE" \
            --file=images/custom/Containerfile .

      # --------------------------------------------------
      # 5. Verify image exists
      # --------------------------------------------------

      - name: Verify Image Exists
        run: |
          docker image inspect "$IMAGE" > /dev/null

          echo "Image successfully built:"
          echo "$IMAGE"

      # --------------------------------------------------
      # 6. Verify Bench exists
      # --------------------------------------------------

      - name: Verify Bench Exists
        run: |
          docker run --rm "$IMAGE" bench version

      # --------------------------------------------------
      # 7. Verify installed apps inside image
      # --------------------------------------------------

      - name: Verify Installed Apps In Image
        run: |
          docker run --rm "$IMAGE" bench version | tee versions.txt

          grep frappe versions.txt
          grep erpnext versions.txt
          grep hrms versions.txt
          grep helpdesk versions.txt
          grep insights versions.txt
          grep builder versions.txt
          grep lms versions.txt
          grep payments versions.txt
          grep telephony versions.txt
          grep wiki versions.txt

      # --------------------------------------------------
      # 8. Create .env from GitHub Variables and Secrets
      # --------------------------------------------------

      - name: Create Environment File
        run: |
          umask 077

          cat > .env <<EOF
          IMAGE=${IMAGE}
          SITE_NAME=${SITE_NAME}
          ADMIN_PASS=${ADMIN_PASS}
          DB_ROOT_PASS=${DB_ROOT_PASS}
          HTTP_PUBLISH_PORT=${HTTP_PUBLISH_PORT}
          GUNICORN_THREADS=${GUNICORN_THREADS}
          GUNICORN_WORKERS=${GUNICORN_WORKERS}
          GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT}
          EOF

          echo ".env file created successfully."

      # --------------------------------------------------
      # 9. Start Docker Compose stack
      # --------------------------------------------------

      - name: Start Compose Stack
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            up -d

      # --------------------------------------------------
      # 9.1. Debug NLTK Init Failure
      # --------------------------------------------------

      - name: Debug NLTK Init Failure
        if: always()
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            logs --no-color nltk-init || true

          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            ps -a

      # --------------------------------------------------
      # 10. Show running containers
      # --------------------------------------------------

      - name: Show Running Containers
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            ps

      # --------------------------------------------------
      # 11. Wait for backend startup
      # --------------------------------------------------

      - name: Wait For Backend Startup
        run: |
          sleep 60



      # --------------------------------------------------
      # 13. Verify Redis configuration
      # --------------------------------------------------

      - name: Verify Redis Configuration
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            cat /home/frappe/frappe-bench/sites/common_site_config.json


      # --------------------------------------------------
      # 20. Set default homepage to Desk
      # --------------------------------------------------

      - name: Set Default Homepage To Desk
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.set_single_value \
            --args "['Website Settings','home_page','desk']"

          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" clear-cache

      # --------------------------------------------------
      # 21. Verify homepage
      # --------------------------------------------------

      - name: Verify Homepage Is Desk
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.get_single_value \
            --args "['Website Settings','home_page']"

      # --------------------------------------------------
      # 22. List installed apps
      # --------------------------------------------------

      - name: List Installed Apps
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" list-apps

      # --------------------------------------------------
      # 23. Validate site health
      # --------------------------------------------------

      - name: Validate Site Health
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" doctor

      # --------------------------------------------------
      # 24. Full stack migration test
      # --------------------------------------------------

      - name: Full Stack Migration Test
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" migrate

      # --------------------------------------------------
      # 25. Validate installed apps after migration
      # --------------------------------------------------

      - name: Validate Installed Apps After Migration
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" list-apps

      # --------------------------------------------------
      # 26. Validate ERPNext DocType
      # --------------------------------------------------

      - name: Validate ERPNext Doctype
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.exists \
            --args "['DocType','Sales Order']"

      # --------------------------------------------------
      # 27. Validate HRMS DocType
      # --------------------------------------------------

      - name: Validate HRMS Doctype
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.exists \
            --args "['DocType','Employee']"

      # --------------------------------------------------
      # 28. Validate Helpdesk DocType
      # --------------------------------------------------

      - name: Validate Helpdesk Doctype
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.exists \
            --args "['DocType','HD Ticket']"

      # --------------------------------------------------
      # 29. Validate Builder DocType
      # --------------------------------------------------

      - name: Validate Builder Doctype
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.exists \
            --args "['DocType','Builder Page']"

      # --------------------------------------------------
      # 30. Validate Insights DocType
      # --------------------------------------------------

      - name: Validate Insights Doctype
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.exists \
            --args "['DocType','Insights Data Source']"

      # --------------------------------------------------
      # 31. Validate LMS DocType
      # --------------------------------------------------

      - name: Validate LMS Doctype
        run: |
          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            exec -T backend \
            bench --site "$SITE_NAME" execute frappe.db.exists \
            --args "['DocType','LMS Course']"

      # --------------------------------------------------
      # 32. Validate login page
      # --------------------------------------------------

      - name: Validate Login Page
        run: |
          curl \
            --fail \
            -H "Host: $SITE_NAME" \
            "http://localhost:${HTTP_PUBLISH_PORT:-8080}/login" \
            > login.html

          grep -q "Sign In" login.html

      # --------------------------------------------------
      # 33. Validate Desk route
      # --------------------------------------------------

      - name: Validate Desk Route
        run: |
          echo "===== WAITING FOR DESK ====="

          success=false

          for i in $(seq 1 30); do
            HTTP_CODE=$(curl -L -sS -o desk.html -w "%{http_code}" \
              -H "Host: $SITE_NAME" \
              "http://localhost:${HTTP_PUBLISH_PORT:-8080}/app/" || true)

            echo "Attempt $i HTTP Status: $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              success=true
              break
            fi

            sleep 10
          done

          if [ "$success" = false ]; then
            echo "Desk route never became available"
            exit 1
          fi

          echo "===== DESK RESPONSE ====="
          ls -lh desk.html || true

          echo "===== FIRST 100 LINES ====="
          head -100 desk.html || true

          grep -q "<!DOCTYPE html>" desk.html

      # --------------------------------------------------
      # 34. Login to Docker Hub
      # --------------------------------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------
      # 35. Push image to Docker Hub
      # This runs only if all previous validation steps pass.
      # --------------------------------------------------

      - name: Push Image to Docker Hub
        run: |
          docker push "$IMAGE"

          echo "Successfully pushed image:"
          echo "$IMAGE"

      # --------------------------------------------------
      # 36. Show logs if any step fails
      # --------------------------------------------------

      - name: Show Container Logs On Failure
        if: failure()
        run: |
          echo "===== BACKEND LOGS ====="

          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            logs --tail=200 backend || true

          echo "===== FRONTEND LOGS ====="

          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            logs --tail=200 frontend || true

          echo "===== CONFIGURATOR LOGS ====="

          docker compose \
            --env-file .env \
            -f compose.yaml \
            -f overrides/compose.mariadb.yaml \
            -f overrides/compose.redis.yaml \
            -f overrides/compose.noproxy.yaml \
            logs --tail=200 configurator || true

          echo "===== DESK RESPONSE ====="

          curl -L -v \
            -H "Host: $SITE_NAME" \
            "http://localhost:${HTTP_PUBLISH_PORT:-8080}/app/" || true