name: Unity Release

on:
  workflow_run:
    workflows:
      - Unity PR Validation
    types:
      - completed

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git SHA
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Release Image
        run: |
          docker buildx build \
            --load \
            --build-arg=FRAPPE_PATH=https://github.com/frappe/frappe \
            --build-arg=FRAPPE_BRANCH=version-16 \
            --secret=id=apps_json,src=apps.json \
            --tag=piyush2880/erpnext-custom:latest \
            --tag=piyush2880/erpnext-custom:${{ steps.vars.outputs.sha_short }} \
            --file=images/custom/Containerfile .

      - name: Verify Image
        run: |
          docker run --rm piyush2880/erpnext-custom:latest bench version

      - name: Verify Required Apps
        run: |
          docker run --rm piyush2880/erpnext-custom:latest bench version | tee versions.txt

          grep frappe versions.txt
          grep erpnext versions.txt
          grep hrms versions.txt
          grep helpdesk versions.txt
          grep builder versions.txt
          grep insights versions.txt
          grep lms versions.txt
          grep payments versions.txt
          grep telephony versions.txt

      - name: Push Latest Tag
        run: |
          docker push piyush2880/erpnext-custom:latest

      - name: Push Commit SHA Tag
        run: |
          docker push piyush2880/erpnext-custom:${{ steps.vars.outputs.sha_short }}